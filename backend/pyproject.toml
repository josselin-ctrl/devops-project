[project]
name = "devops-backend"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn==0.34.0",
    "psycopg2-binary==2.9.10",
    "prometheus-fastapi-instrumentator==7.0.2",
    "boto3==1.35.99",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "httpx==0.28.1",
    "ruff==0.9.4",
]

[tool.pytest.ini_options]
# On déclare une "étiquette" (marker) pour les tests d'intégration.
markers = [
    "integration: test qui a besoin de Floci (l'émulateur AWS local) pour tourner",
]
# addopts = les options ajoutées automatiquement à chaque `pytest`.
# "-m 'not integration'" = par défaut, on saute les tests d'intégration.
# Résultat : `uv run pytest` reste rapide et ne dépend de rien.
# Pour les lancer : `uv run pytest -m integration` (ça remplace l'option ci-dessous).
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
